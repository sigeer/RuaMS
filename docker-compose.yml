services:
  rua-ms:
    container_name: service-rua-ms-server
    image: rua-ms
    # privileged: true  # 启用特权模式
    build:
      context: .
      dockerfile: src/Application.Host/Dockerfile
    depends_on:
      rua-ms-db:
        condition: service_healthy
    environment:
        RUA_MS_Database: "PostgreSQL"
        RUA_MS_ConnectionStrings__PostgreSQL: "Host=rua-ms-db;Port=5432;Database=ruams;Username=postgres;Password=root"
        ## 此处修改HOST
        # RUA_MS_ChannelServerConfig__ServerHost: 127.0.0.1
        # RUA_MS_EnableOpenApi: false
    ports:
      - "8080:8080"
      # 登录服务器
      - "8484:8484"
      # 频道服务器
      - "7575-7600:7575-7600"
    volumes:
      - ./logs:/app/logs

  rua-ms-db:
    container_name: service-rua-ms-db
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "ruams"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "root"
    ports:
      - "5432:5432"
    volumes:
      - ./db/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ruams"]
      interval: 10s
      retries: 20
      timeout: 10s
