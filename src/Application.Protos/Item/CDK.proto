syntax = "proto3";

package ItemProto;

message UseCdkRequest {
	int32 masterId =1;
	string cdk = 2;
}

message UseCdkResponse {
	int32 code = 1;
	repeated  CdkRewordPackageDto items = 2;
}

message CdkRewordPackageDto {
	int32 itemId = 1;
	int32 quantity = 2;
}

message UseIdRequest  {
	int32 masterId =1;
	int32 id = 2;
}