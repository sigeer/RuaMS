syntax = "proto3";

import "Base/ItemQuantity.proto";
import "google/protobuf/wrappers.proto";

package ItemProto;

message GetRewardsRequestProto {
	int32 playerId = 1;
}

message GetRewardsResponseProto {
	int32 playerId = 1;
	repeated RewardPreviewProto rewards = 2;
}

message RewardPreviewProto {
	string title = 1;
	string description = 2;
	int32 id = 3;
}