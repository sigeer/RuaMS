syntax = "proto3";

import "Model/Item.proto";
import "Model/ItemTransfer.proto";
import "Model/MTS.proto";

import "google/protobuf/wrappers.proto";
package ProtoService;


// 拍卖行（MTS / ITC）的跨服接口，频道 -> 中心服务器
service MTSService {
	rpc ChangePage (ChangePageRequest) returns (ChangePageResponse);
	rpc SaleItem (SaleItemRequest) returns (SaleItemResponse);
	rpc CancelSaleItem (CancelSaleItemRequest) returns (CancelSaleItemResponse);
	rpc AddItemToCart (AddItemToCartRequest) returns (AddItemToCartResponse);
	rpc RemoveItemFromCart (RemoveItemFromCartRequest) returns (RemoveItemFromCartResponse);
	rpc TakeItem (TakeItemRequest) returns (TakeItemResponse);
	rpc Buy (BuyRequest) returns (BuyResponse);
	// 求购：登记 / 撤销 / 与求购单成交
	rpc RegisterWanted (WantedRequest) returns (MTSOperationResponse);
	rpc CancelWanted (ProductRequest) returns (MTSOperationResponse);
	rpc FulfillWanted (FulfillWantedRequest) returns (MTSOperationResponse);
	// op 11 / op 12 只带商品id，频道侧得先知道求购的是什么物品才能从背包里取出来
	rpc LoadWanted (ProductRequest) returns (MTSOperationResponse);
	// 拍卖：上架 / 出价（即买走 Buy）
	rpc RegisterAuction (SaleItemRequest) returns (SaleItemResponse);
	rpc BidAuction (BidRequest) returns (MTSOperationResponse);
}


message MTSOperationResponse {
	int32 code = 1;
	int32 masterId = 2;
	ProtoModel.MTSItemProto product = 3;
	ProtoModel.PlayerMTSInfoProto myMTSInfo = 4;
	ProtoModel.PagedItemsProto pageData = 5;
	// 操作后买家的抵用券余额（购买/出价成功时回填）
	int32 updatedValue = 6;
}


message WantedRequest {
	ProtoModel.MTSQueryProto query = 1;
	int32 itemId = 2;
	int32 price = 3;
	int32 quantity = 4;
	int32 tab = 5;
	int32 type = 6;
	string buyerName = 7;
	int32 durationHours = 8;
}


message ProductRequest {
	ProtoModel.MTSQueryProto query = 1;
	int32 productId = 2;
}


message FulfillWantedRequest {
	ProtoModel.MTSQueryProto query = 1;
	int32 productId = 2;
	// 上一版由频道把物品整件传上来；现在背包由中心服持有，只带「从哪取多少」即可
	reserved 3, 4, 5;
	// 1=装备 2=消耗 3=设置 4=其他 5=现金
	int32 inventoryType = 6;
	int32 itemId = 7;
	int32 quantity = 8;
}


message BidRequest {
	ProtoModel.MTSQueryProto query = 1;
	int32 productId = 2;
	int32 bid = 3;
}


message MTSQueryResponse {
	ProtoModel.PagedItemsProto pageData = 1;
	ProtoModel.PlayerMTSInfoProto myMTSInfo = 2;
}



message SaleItemRequest {
	int32 masterId = 1;
	// MTS 期间背包由中心服持有（频道侧的 Player 已脱离世界），所以只告诉中心服从哪个格子取
	reserved 2;
	// 普通出售：售价；拍卖：起拍价
	int32 price = 3;
	string sellerName = 4;
	int32 tab = 5;
	int32 type = 6;
	// 拍卖专用：时长（小时）
	int32 durationHours = 7;
	// 拍卖专用：一口价（卖家填的即买价，与起拍价是两个独立的输入框）
	int32 buyNow = 8;
	// 拍卖专用：加价幅度
	int32 bidIncrement = 9;
	reserved 10, 11;
	// 1=装备 2=消耗 3=设置 4=其他 5=现金
	int32 inventoryType = 12;
	int32 slot = 13;
	int32 quantity = 14;
}



message SaleItemResponse {
	int32 code = 1;
	int32 masterId = 2;
	ProtoModel.PlayerMTSInfoProto myMTSInfo = 4;
	ProtoModel.PagedItemsProto pageData = 5;
}



message CancelSaleItemRequest {
	int32 masterId = 1;
	int32 productId = 2;
}



message CancelSaleItemResponse {
	int32 code = 1;
	int32 masterId = 2;
	ProtoModel.PlayerMTSInfoProto myMTSInfo = 3;
	ProtoModel.PagedItemsProto pageData = 4;
}



message AddItemToCartRequest {
	ProtoModel.MTSQueryProto query = 1;
	int32 productId = 2;
}



message AddItemToCartResponse {
	int32 code = 1;
	int32 masterId = 2;
	ProtoModel.PlayerMTSInfoProto myMTSInfo = 3;
	ProtoModel.PagedItemsProto pageData = 4;
}



message RemoveItemFromCartRequest {
	ProtoModel.MTSQueryProto query = 1;
	int32 productId = 2;
}



message RemoveItemFromCartResponse {
	int32 code = 1;
	int32 masterId = 2;
	ProtoModel.PlayerMTSInfoProto myMTSInfo = 3;
	ProtoModel.PagedItemsProto pageData = 4;
}



message ChangePageRequest {
	int32 masterId = 1;
	int32 tab = 2;
	int32 type = 3;
	int32 page = 4;
	int32 searchType = 5;
	google.protobuf.StringValue searchText = 6;
	repeated int32 filterItemId = 7;
}



message ChangePageResponse {
	int32 masterId = 1;
	int32 tab = 2;
	int32 type = 3;
	int32 page = 4;
	int32 totalPages = 5;
	repeated ProtoModel.MTSItemProto items = 6;
	ProtoModel.PlayerMTSInfoProto myMTSInfo = 7;
}



message TakeItemRequest {
	ProtoModel.MTSQueryProto query = 1;
	int32 productId = 2;
	// 单进程完成：中心服把物品直接放进持有者的背包副本，并返回落点
	reserved 3, 4;
}



message TakeItemResponse {
	int32 code = 1;
	int32 masterId = 2;
	ProtoModel.ItemProto item = 3;
	ProtoModel.PlayerMTSInfoProto myMTSInfo = 4;
	ProtoModel.PagedItemsProto cartItems = 5;
	ProtoModel.PagedItemsProto pageData = 6;
	// 物品在背包里落到的格子（op 39 要显示给客户端）
	int32 position = 7;
}



message BuyRequest {
	ProtoModel.MTSQueryProto query = 1;
	int32 productId = 2;
}



message BuyResponse {
	int32 code = 1;
	int32 masterId = 2;
	ProtoModel.ItemProto item = 3;
	ProtoModel.PlayerMTSInfoProto myMTSInfo = 4;
	ProtoModel.PagedItemsProto cartItems = 5;
	ProtoModel.PagedItemsProto pageData = 6;
	int32 updatedValue = 7;
}
