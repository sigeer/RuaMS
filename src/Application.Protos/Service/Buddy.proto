syntax = "proto3";

import "Model/Buddy.proto";

package ProtoService;



message BuddyChatRequest {
	int32 fromId = 1;
	repeated int32 toIds = 2;
	string text = 3;
}



message AddBuddyRequest {
	int32 masterId = 1;
	string targetName = 2;
	string groupName = 3;
}



message AddBuddyByIdRequest {
	int32 masterId = 1;
	int32 targetId = 2;
}



message AddBuddyResponse {
	int32 code = 1;
	int32 targetId = 2;
	ProtoModel.BuddyProto buddy = 3;
	int32 masterId = 4;
	string targetName = 5;
}



message DeleteBuddyRequest {
	int32 masterId = 1;
	int32 buddyid = 2;
}



message DeleteBuddyResponse {
	int32 code = 1;
	int32 masterId = 2;
	int32 buddyid = 3;
}



message GetLocationRequest {
	int32 masterId = 1;
	string targetName = 2;
}



message GetLocationResponse {
	int32 code = 1;
	int32 field = 2;
	int32 masterId = 3;
	string targetName = 4;
}
