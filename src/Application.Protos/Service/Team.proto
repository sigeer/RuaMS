syntax = "proto3";

import "Model/Team.proto";

package ProtoService;



message GetTeamRequest {
	int32 id = 1;
}



message GetTeamResponse {
	ProtoModel.TeamProto model = 1;
}



message CreateTeamRequest {
	int32 leaderId = 1;
	int32 method = 2;
}



message CreateTeamResponse{
	int32 code = 1;
	CreateTeamRequest request = 2;
	ProtoModel.TeamProto teamDto = 3;
}
