syntax = "proto3";

import "Model/HiredMerchant.proto";

package ProtoService;



message CommitRetrievedRequest {
	int32 ownerId = 1;
}



message CommitRetrievedResponse {
	bool isSuccess = 1;;
}



message GetPlayerHiredMerchantRequest {
	int32 masterId = 1;
}



message SyncPlayerShopRequest {
	int32 ownerId = 1;
	string title = 2;
	int32 channel = 3;
	int32 mapId = 4;
	repeated ProtoModel.PlayerShopItemProto items = 5;
	int32 meso = 6;
	int32 type = 7;
	int32 operation = 8;
	int32 mapObjectId = 9;
}



message BatchSyncPlayerShopRequest {
	repeated SyncPlayerShopRequest list = 1;
}



message NotifyItemPurchasedResponse {
	int32 ownerId = 1;
	int32 itemId = 2;
	int32 quantity = 3;
	int32 gainedMeso = 4;
	int32 left = 5;
}



message NotifyPlayerHiredMerchantResponse {
	int32 ownerId = 1;
	int32 status = 2;
}



message SearchHiredMerchantChannelRequest {
	int32 masterId = 1;
}



message SearchHiredMerchantChannelResponse {
	int32 channel = 1;
}
