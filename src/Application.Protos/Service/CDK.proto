syntax = "proto3";

import "Model/CDK.proto";
import "Model/ItemTransfer.proto";

package ProtoService;



message UseCdkRequest {
	int32 masterId =1;
	string cdk = 2;
	// 与 MTS 同一套物品转移协议：PREPARE 只校验并占位，COMMIT 才真正核销
	int64 token = 3;
	ProtoModel.TransferStage stage = 4;
}



message UseCdkResponse {
	int32 code = 1;
	repeated  ProtoModel.CdkRewordPackageProto items = 2;
}



message UseIdRequest  {
	int32 masterId =1;
	int32 id = 2;
	int64 token = 3;
	ProtoModel.TransferStage stage = 4;
}
