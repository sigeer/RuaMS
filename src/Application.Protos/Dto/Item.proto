syntax = "proto3";

import "google/protobuf/wrappers.proto";

import "Dto/Equip.proto";
import "Dto/Pet.proto";

package Dto;

message ItemDto {
  int64 uniqueId = 1;
  int32 itemid = 2;
  int32 quantity = 3;
  int32 position = 4;
  string owner = 5;
  int32 flag = 6;
  int64 expiration = 7;
  string giftFrom = 8;
  EquipDto equipInfo = 9;
  PetDto petInfo = 10;
  google.protobuf.StringValue properties = 11;
}
