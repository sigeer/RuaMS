syntax = "proto3";

package ProtoModel;

// 物品在「频道背包」和「中心服仓库」之间搬运的三个阶段。
// 一次逻辑操作固定一个 token（频道侧生成），三个阶段和所有重试都用同一个 token，
// 中心服据此做到幂等：同 token 重放返回同一结论，绝不重复执行。
enum TransferStage {
	PREPARE = 0;   // 占位：校验并暂存，不改动玩家背包、不对外可见
	COMMIT = 1;    // 落定：真正生效
	ABORT = 2;     // 放弃：撤销暂存（频道进程挂掉时不会发这个，暂存会按过期规则留给玩家自己取回）
}
