syntax = "proto3";

package ProtoModel;



message PlayerNPCProto {
	string name = 1;
	int32 x = 2;
	int32 cy = 3;
	int32 mapId = 4;
	int32 rx0 = 5;
	int32 rx1 = 6;
	int32 hair = 7;
	int32 face = 8;
	int32 skin = 9;
	int32 scriptId = 10;
	int32 jobId = 11;
	int32 fh = 12;
	int32 gender = 13;
	int32 dir = 14;
	int32 playerId = 15;
	bool isHonor = 16;
	int32 overallRank = 17;
	int32 jobRank = 18;
	repeated PlayerNPCEquipProto equips = 19;
}



message PlayerNPCEquipProto {
	int32 position = 1;
	int32 itemId = 2;
}
